<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu đặt phòng - Đặng Thành Long</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/long-rooms.css">
</head>

<body>
    <div id="app">
        <div class="sidebar">
            <h2>QUẢN LÝ<br>PHÒNG HỌC</h2>
            <a href="luong-home.html" class="menu-link">Trang chủ</a>
            <a href="long-rooms.html" class="menu-link">Quản lý phòng học</a>
            <a href="linh-calendar.html" class="menu-link">Lịch học</a>

                <div class="table-container">
                    <table id="requestTable">

                                <th>Ngày và giờ</th>
                                <th>Mục đích</th>

                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
