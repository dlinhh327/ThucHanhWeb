<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý phòng học</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/quan-login-users.css">
</head>

<body>

    <!-- Minh Quân: Đăng nhập -->
    <div id="loginPage" class="login-page">

        <form id="loginForm" class="login-box">
            <h2>QUẢN LÝ PHÒNG HỌC</h2>
            <p>Đăng nhập hệ thống</p>

            <label>Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>

            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu" required>

            <button type="submit">Đăng nhập</button>

            <p id="loginMessage"></p>

            <div class="demo-account">
                Tài khoản: admin<br>
                Mật khẩu: 123456
            </div>
        </form>

    </div>

    <script src="../js/quan-login-users.js"></script>
</body>

</html>
