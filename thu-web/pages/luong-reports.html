<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo thống kê - Lượng</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/luong-reports.css">
</head>

<body>
    <div id="app">
        <div class="sidebar">
            <h2>QUẢN LÝ<br>PHÒNG HỌC</h2>
            <a href="luong-home.html" class="menu-link">Trang chủ</a>
            <a href="long-rooms.html" class="menu-link">Quản lý phòng học</a>
            <a href="linh-calendar.html" class="menu-link">Lịch học</a>
            <a href="linh-booking.html" class="menu-link">Đặt phòng</a>
            <a href="long-requests.html" class="menu-link">Yêu cầu đặt phòng</a>
            <a href="quan-users.html" class="menu-link">Người dùng</a>
            <a href="luong-reports.html" class="menu-link active">Báo cáo</a>
            <button id="logoutBtn" class="logout-btn">Đăng xuất</button>
        </div>

        <div class="main">
            <div class="header">
                <input type="text" id="searchInput" placeholder="Tìm kiếm dữ liệu...">
                <span id="currentUser">Quản trị viên</span>
            </div>

            <div id="reports" class="page">
                <h1>Báo cáo thống kê</h1>

                <div class="cards">
                    <div class="card">
                        <p>Tổng số phòng</p>
                        <h2 id="reportTotal">0</h2>
                    </div>
                    <div class="card">
                        <p>Phòng đang sử dụng</p>
                        <h2 id="reportUsed">0</h2>
                    </div>
                    <div class="card">
                        <p>Phòng trống</p>
                        <h2 id="reportEmpty">0</h2>
                    </div>
                    <div class="card">
                        <p>Yêu cầu chờ duyệt</p>
                        <h2 id="reportPending">0</h2>
                    </div>
                </div>

                <button type="button" id="printReportBtn">In báo cáo</button>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/luong-reports.js"></script>
</body>

</html>
